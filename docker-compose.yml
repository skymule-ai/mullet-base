services:
  ros2-base:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/skymule-ai/mullet-base:${MULLET_ROS_IMAGE_TAG:-main}
    container_name: mullet-base
    shm_size: "2g"
    stdin_open: true
    tty: true
    runtime: nvidia
    # On a drone: its identity (ROS_DOMAIN_ID, DRONE_ID, ...) from mullet-setup, shared by every Compose
    # project there. Optional, so the shell also starts on a laptop (domain 0 unless MULLET_DRONE_ENV
    # points at a copy).
    env_file:
      - path: ${MULLET_DRONE_ENV:-/etc/mullet/drone.env}
        required: false
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ./ws:/ws:rw
    devices:
      - ${MULLET_UART_DEVICE:-/dev/ttyTHS1}:/dev/ttyTHS1
    command: ["bash"]
    network_mode: host
